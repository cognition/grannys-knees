name: Android

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Avoid the action's default obsolete `tools` package (sdkmanager fails on it).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # API 37 ships as platforms;android-37.0 (directory android-37.0), not android-37.
      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests and assemble debug APK
        run: ./gradlew test assembleDebug --stacktrace
